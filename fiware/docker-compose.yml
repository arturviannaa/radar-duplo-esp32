# Stack minima do FIWARE para receber as leituras do radar duplo por MQTT.
#
# Fluxo:
#   ESP32 --MQTT--> mosquitto --MQTT--> iot-agent --NGSI--> orion <-- consultas HTTP
#
# Portas expostas no host:
#   1883   MQTT (ESP32 publica aqui)
#   1026   Orion NGSI v2 (HTTP)
#   4041   IoT Agent (admin API: provisionamento)
services:
  mongo:
    image: mongo:6.0
    container_name: radar-mongo
    command: --nojournal
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  orion:
    image: fiware/orion:3.10.1
    container_name: radar-orion
    depends_on:
      - mongo
    ports:
      - "1026:1026"
    command: -dbhost mongo -logLevel INFO
    restart: unless-stopped

  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: radar-mosquitto
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped

  iot-agent:
    image: fiware/iotagent-json:2.4.2
    container_name: radar-iot-agent
    depends_on:
      - mongo
      - mosquitto
      - orion
    ports:
      - "4041:4041"
    environment:
      - IOTA_CB_HOST=orion
      - IOTA_CB_PORT=1026
      - IOTA_NORTH_PORT=4041
      - IOTA_REGISTRY_TYPE=mongodb
      - IOTA_MONGO_HOST=mongo
      - IOTA_MONGO_PORT=27017
      - IOTA_MONGO_DB=iotagentjson
      - IOTA_PROVIDER_URL=http://iot-agent:4041
      - IOTA_DEFAULT_RESOURCE=
      - IOTA_MQTT_HOST=mosquitto
      - IOTA_MQTT_PORT=1883
      - IOTA_LOG_LEVEL=INFO
      - IOTA_TIMESTAMP=true
      - IOTA_CB_NGSI_VERSION=v2
      - IOTA_AUTOCAST=true
    restart: unless-stopped

volumes:
  mongo-data:
